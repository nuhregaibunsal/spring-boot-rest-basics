# ---------------------------------------------------------------------------
# i2i Academy - Spring Boot assignment configuration
# ---------------------------------------------------------------------------

# Application identity
spring.application.name=i2i-Academy-SpringBoot

# Embedded server
server.port=8080

# Actuator: expose only a read-only health endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Build/info shown on the /actuator/info endpoint
info.app.name=i2i Academy Spring Boot
info.app.description=A simple REST web service built for the i2i Academy bootcamp
info.app.version=1.0.0
